<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>寻宝东莞</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-input="keyboard">
    <!-- START 首页 -->
    <div id="start-screen" class="screen">
      <div class="screen-grain"></div>
      <div class="title-wrap">
        <div class="title-arc arc-top"></div>
        <h1 class="game-title">寻宝东莞</h1>
        <div class="title-arc arc-bottom"></div>
      </div>
      <div class="hero"></div>
      <div class="guide"></div>
      <div class="dialog-box bronze-panel">昨夜子时，镇馆的纵目面具自己裂开了。灵韵散成十五道碎光，落进东莞六个地方。我是从神树纹里醒来的昭，你是守藏灵瞳——去把它们带回来，别让「锈」先找到。</div>
      <div class="start-actions">
        <div class="start-btn bronze-btn selected" id="btn-continue">继续游戏</div>
        <div class="start-btn bronze-btn" id="btn-reset">重置关卡</div>
      </div>
      <div class="start-hint hint-bar">
        <span class="hint-item">
          <span class="keycap keycap--dpad" data-pad="◀" data-kb="←"></span>
          <span class="keycap keycap--dpad" data-pad="▶" data-kb="→"></span>
          <span class="hint-label">选择</span>
        </span>
        <span class="hint-item">
          <span class="keycap keycap--a" data-pad="A" data-kb="空格"></span>
          <span class="hint-label">确认</span>
        </span>
      </div>
    </div>

    <!-- 首页剧情：继续游戏后先播放文字流剧情，再进入大地图 -->
    <div id="story-screen" class="screen hidden">
      <div class="screen-grain"></div>
      <div class="story-stage">
        <div class="story-text" id="story-text"></div>
        <div class="story-hint hint-bar" id="story-hint"></div>
      </div>
    </div>

    <!-- 大地图：选择关卡（节点顺序自西向东，与 main.ts 中 LEVELS 一致） -->
    <div id="world-map-screen" class="screen hidden">
      <div class="screen-grain"></div>
      <h2 class="map-title">东莞寻宝图</h2>
      <div class="map-area">
        <div class="map-bg"></div>
        <span class="frame-corner frame-corner--tl"></span>
        <span class="frame-corner frame-corner--tr"></span>
        <span class="frame-corner frame-corner--br"></span>
        <span class="frame-corner frame-corner--bl"></span>
        <div class="level-node" style="left: 20%; top: 59%;">
          <div class="level-icon" style="background-image: url('/assets/level-3.png');"></div>
          <div class="level-label">
            <span class="level-name">虎门炮台</span>
            <span class="level-sub">海防历史</span>
          </div>
          <span class="seal" aria-hidden="true">藏</span>
        </div>
        <div class="level-node major" style="left: 32%; top: 33%;">
          <div class="level-icon" style="background-image: url('/assets/level-6.png');"></div>
          <div class="level-label">
            <span class="level-name">东莞博物馆新馆</span>
            <span class="level-sub">终极关卡</span>
          </div>
          <span class="seal" aria-hidden="true">藏</span>
        </div>
        <div class="level-node" style="left: 33%; top: 16%;">
          <div class="level-icon" style="background-image: url('/assets/level-2.png');"></div>
          <div class="level-label">
            <span class="level-name">可园</span>
            <span class="level-sub">岭南园林</span>
          </div>
          <span class="seal" aria-hidden="true">藏</span>
        </div>
        <div class="level-node" style="left: 45%; top: 28%;">
          <div class="level-icon" style="background-image: url('/assets/level-4.png');"></div>
          <div class="level-label">
            <span class="level-name">东莞国贸</span>
            <span class="level-sub">现代都市</span>
          </div>
          <span class="seal" aria-hidden="true">藏</span>
        </div>
        <div class="level-node" style="left: 48%; top: 53.5%;">
          <div class="level-icon" style="background-image: url('/assets/level-1.png');"></div>
          <div class="level-label">
            <span class="level-name">松山湖</span>
            <span class="level-sub">科技与自然交融</span>
          </div>
          <span class="seal" aria-hidden="true">藏</span>
        </div>
        <div class="level-node" style="left: 71%; top: 38%;">
          <div class="level-icon" style="background-image: url('/assets/level-5.png');"></div>
          <div class="level-label">
            <span class="level-name">南社古村</span>
            <span class="level-sub">明清宗祠</span>
          </div>
          <span class="seal" aria-hidden="true">藏</span>
        </div>
      </div>
      <div class="map-hint hint-bar" id="map-hint">
        <span class="hint-item">
          <span class="keycap keycap--dpad" data-pad="◀" data-kb="←"></span>
          <span class="keycap keycap--dpad" data-pad="▶" data-kb="→"></span>
          <span class="hint-label">选择关卡</span>
        </span>
        <span class="hint-item">
          <span class="keycap keycap--a" data-pad="A" data-kb="空格"></span>
          <span class="hint-label">进入</span>
        </span>
        <span class="hint-item">
          <span class="keycap keycap--b" data-pad="B" data-kb="Esc"></span>
          <span class="hint-label">返回首页</span>
        </span>
      </div>
    </div>

    <!-- 关卡内（Canvas 游戏场景） -->
    <div id="level-screen" class="screen hidden">
      <canvas id="level-canvas"></canvas>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
